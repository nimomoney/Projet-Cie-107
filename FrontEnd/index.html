<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="stocks">
        <h2>Stocks</h2>
        <div>Fer: <span id="ferStock">0</span> kg</div>
        <div>Charbon: <span id="charbonStock">0</span> kg</div>
        <div>Lingots: <span id="lingotStock">0</span></div>
    </div>

    <div id="ajout">
        <h2>Ajouter au stock</h2>
        <input type="number" id="ferInput" placeholder="kg de fer">
        <input type="number" id="charbonInput" placeholder="kg de charbon">
        <button id="ajouterStock">Ajouter</button>
    </div>

    <div id="fonderie">
        <h2>Créer des lingots</h2>
        <input type="number" id="nbLingots" placeholder="Nombre de lingots">
        <button id="lancerFonderie">Lancer</button>
    </div>

    <div id="message"></div>
</body>

</html>
